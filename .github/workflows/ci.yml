name: Tests and deployment image

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]' build
      - run: python -m pytest
      - name: Check changed observability source and proxy helpers
        run: |
          python -m ruff check app/telemetry app/settings.py app/api/application.py app/api/schemas.py tests/unit/test_jtop_provider.py tests/unit/test_telemetry_journal.py tests/unit/test_settings.py tests/unit/test_release_version.py tests/api/test_telemetry_api_v2.py scripts/verify-jtop-socket-proxy.py
          python -m ruff format --check app/telemetry/jtop.py app/telemetry/journal.py app/settings.py app/api/application.py app/api/schemas.py tests/unit/test_jtop_provider.py tests/unit/test_telemetry_journal.py tests/unit/test_settings.py tests/unit/test_release_version.py tests/api/test_telemetry_api_v2.py scripts/verify-jtop-socket-proxy.py
          bash -n scripts/restrict-jtop-proxy-socket.sh
          python scripts/verify-jtop-socket-proxy.py
      - run: python -m pip check
      - run: python -m build

  image:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 .github/scripts/validate_compose.py
      - name: Build native image
        env:
          VCS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: docker build --build-arg VCS_REF="$VCS_REF" --tag jetson-resource-router:ci .
      - run: python3 .github/scripts/validate_image.py
