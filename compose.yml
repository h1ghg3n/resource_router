services:
  resource-router:
    image: "${JETROUTER_IMAGE:-jetson-resource-router:local}"
    build:
      context: .
      args:
        JETSON_STATS_VERSION: "${JETSON_STATS_VERSION:-7.2.2}"
        VCS_REF: "${VCS_REF:-unknown}"
    environment:
      JETROUTER_RECLAIMABLE_CACHE_FRACTION: "0.90"
    user: "${JETROUTER_UID:?Set JETROUTER_UID to the service account UID}:${JTOP_GID:?Set JTOP_GID to the host jtop socket group GID}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:19081:19081"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - /run/jtop.sock:/run/jtop.sock:ro
      - ./data:/app/data
    networks:
      - resource-plane
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:19081/health/ready', timeout=2)
      interval: 30s
      timeout: 3s
      retries: 6
      start_period: 15s

networks:
  resource-plane:
    external: true
    name: jetson-resource-plane
