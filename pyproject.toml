[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jetson-resource-router"
version = "0.1.0"
description = "Single-node resource admission and lease service for Jetson Orin"
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "fastapi>=0.141,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.3,<9",
]

[project.scripts]
jetrouter = "app.__main__:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
